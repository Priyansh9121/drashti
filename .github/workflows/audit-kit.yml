name: Audit kit

# macOS and Windows runners only when the audit kit changes on main, in pull
# requests, or when started by hand (private-repo minutes).
on:
  push:
    branches: [main]
    paths: ['tools/audit/**', '.github/workflows/audit-kit.yml']
  pull_request:
    paths: ['tools/audit/**', '.github/workflows/audit-kit.yml']
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-kit:
    name: Audit scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Bash syntax (macOS)
        if: runner.os == 'macOS'
        run: bash -n tools/audit/audit-mac.sh
      - name: Static checks with PowerShell 7
        shell: pwsh
        run: ./tools/audit/test/check-windows-script.ps1
      - name: Static checks with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/audit/test/check-windows-script.ps1
      - name: Fixture tests and a full run on this runner
        run: node tools/audit/test/run-tests.mjs --full

  # The kit as it goes to the mandir on a USB drive (Session 16): the two scripts, the README and the
  # operators' checklist, without the tests. Download it from this run's artifacts.
  package:
    name: The audit kit for the USB drive
    needs: audit-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the kit together
        run: |
          mkdir -p kit/audit
          cp tools/audit/audit-mac.sh tools/audit/audit-windows.ps1 tools/audit/README.md tools/audit/SETUP-CHECKLIST.md kit/audit/
          ls -la kit/audit
      - name: Keep it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drashti-audit-kit
          path: kit
          if-no-files-found: error
          retention-days: 30
