name: Release

# Builds a release of Drashti (Session 14): the Mac and Windows installers, signed and notarised when
# the certificates are given as repository secrets (and left unsigned, cleanly, when they are not), the
# update manifest Drashti's update check reads (drashti-update.json), checksums, and FFmpeg's source.
#
# It publishes a GitHub release only when started by hand with "publish" ticked, from main. Otherwise
# (publish off, or a push to the scratch branch release-dry-run) it builds and checks everything and
# keeps the files as an artifact for 7 days: a dry run, which publishes nothing.
#
# Secrets it reads (none is required; each is only ever passed to the packaging script, never printed):
#   MAC_CERT_P12, MAC_CERT_PASSWORD                       Developer ID Application certificate
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER  App Store Connect key, for notarisation
#   WIN_CERT_PFX, WIN_CERT_PASSWORD                       a Windows code-signing certificate, or:
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#   AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_PUBLISHER_NAME   Azure Trusted Signing
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the GitHub release (only from main). Off: a dry run that publishes nothing.'
        type: boolean
        default: false
  push:
    branches: [release-dry-run]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache FFmpeg downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/drashti
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}
      - name: Fetch FFmpeg
        run: node scripts/fetch-ffmpeg.mjs
      - name: Fetch FFmpeg for Intel Macs too
        if: runner.os == 'macOS'
        run: node scripts/fetch-ffmpeg.mjs --target darwin-x64
      - run: pnpm build
      - name: Package (signed when the certificates are given)
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: node scripts/package-release.mjs
      - name: Check the signatures (when signed)
        run: node scripts/verify-signing.mjs
      - name: Each packaged app finds and runs its FFmpeg
        run: node scripts/check-ffmpeg.mjs --packaged
      - name: Restart after a restore (packaged app)
        run: node scripts/check-relaunch.mjs --packaged
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: downloaded
      - name: Put the installers together
        run: |
          mkdir -p release-files
          find downloaded -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release-files/ \;
          ls -la release-files
      - name: The update manifest, checksums and FFmpeg's source
        run: node scripts/release-assets.mjs --dir release-files --repo "$GITHUB_REPOSITORY"
      - name: What the update check will read
        run: cat release-files/drashti-update.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release-files
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: assemble
    # Only by hand, with publish ticked, from main.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release-files
      - name: Create the release (never over an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released: bump the version first."; exit 1
          fi
          # Not marked as a pre-release, so releases/latest (what Drashti checks) finds it.
          gh release create "v$version" release-files/* --target "$GITHUB_SHA" --title "Drashti $version" \
            --notes "Drashti $version. Installers for macOS (Apple silicon and Intel) and Windows; drashti-update.json is what Drashti's update check reads; SOURCES.md says where every part's source is."
