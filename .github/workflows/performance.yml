name: Performance

# The performance check (README, "Performance check"), started by hand only:
# CI machines are virtual and stall now and then, so their timings say
# little about the mandir's computers. Useful to compare one change with
# another on the same kind of runner; the real answer comes from running the
# installed app on the mandir's Mac and PC.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating systems to run on
        type: choice
        options: [both, windows, macos]
        default: both
      devices:
        description: Paired Remote devices following the state feed during the check (0 for none)
        type: number
        default: 0
      nodes:
        description: Output nodes following the show over the node link, each copying a 32 MB file, during the check (0 for none)
        type: number
        default: 0
      music:
        description: An audio playlist plays during the check (Session 14)
        type: boolean
        default: false
      sound_cue:
        description: One long sound on the audio layer instead, as a slide's sound cue (Session 15)
        type: boolean
        default: false
      sound_late:
        description: The music (or sound cue) first starts 1.5 s into the measured part, not before it (Session 15)
        type: boolean
        default: false
      no_import:
        description: Slide changes for 20 s with no import, to tell the import's share (Session 15)
        type: boolean
        default: false
      profile:
        description: Keep a CPU profile of the main process, a Chromium trace and the gaps' timeline (an artifact)
        type: boolean
        default: false
      scenario:
        description: A heavy case for the screens (Session 15; needs FFmpeg, fetched for it)
        type: choice
        options:
          [
            none,
            video-1080p30,
            video-1080p60,
            video-4k,
            dissolves-video,
            three-outputs,
            enhanced-pictures,
            bold-transitions,
            lower-thirds,
            lower-thirds-more,
            animations,
          ]
        default: none
      handicap:
        description: 'Modest hardware: two cores for Drashti on Windows, two busy processes competing on a Mac'
        type: boolean
        default: false
      edits:
        description: "An operator's edits (words, a playlist, a theme) every 0.7 s during the import, timed (Session 16)"
        type: boolean
        default: false
      places:
        description: 'The streaming check streams to this many places on the runner at once (Several platforms, Session 28)'
        type: choice
        options: ['1', '2']
        default: '1'
      video_cases_packaged:
        description: 'Instead: these video cases (comma-separated) from a packaged Drashti, as on the mandir computers (Session 16). Not on CI: a packaged Drashti is never let in through the stand-in list, so run these by hand on a computer let in; on CI, choose the case under scenario'
        type: string
        default: ''
      songs:
        description: 'How many files the check imports (400 as on the mandir computers; more for a slower import, fewer for a quicker one; Session 17)'
        type: number
        default: 400
      priority:
        description: "Windows: the main process's priority for the check (Drashti's own choice unless given); Drashti starts at normal either way, as on the mandir PC (Session 17)"
        type: choice
        options: [as-set, above-normal, normal]
        default: as-set
      appearance:
        description: "The operator window's appearance for the check, by id (saffron, dhaja, …; empty: the computer's, White on CI). Session 43: a round measures a colourful one's header and band"
        type: string
        default: ''
      captions:
        description: "Caption AI's two-core proof (CAP-CI-1), Windows only: alone (the captions bench by itself) or alongside (beside this check, both on two cores), then optionally :candidates (rc-gu, rc-hi, small-gu, small-hi, small-en; all when none). Empty: an ordinary run"
        type: string
        default: ''
      translate_intel:
        description: 'Instead: only the translation engine on an Intel Mac (alpha.23, a22-review-mt A2): built there, its instruction set and kernel read, timed on generated models (no model pack)'
        type: boolean
        default: false
      intel_playback:
        description: "Instead: only the hall's video playback on an Intel Mac (alpha.23, QA23-INTELPLAY-1): Drashti built there plays generated test videos through the hall's own player"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  performance:
    name: Performance check (${{ matrix.os }})
    if: ${{ !inputs.translate_intel && !inputs.intel_playback }}
    strategy:
      fail-fast: false
      matrix:
        # The captions bench is Windows' only (two cores by processor mask, as a mandir Main has).
        os: ${{ fromJSON(inputs.captions != '' && '["windows-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The captions input (CAP-CI-1), refused here when mistyped: before anything is installed or downloaded.
      - name: The captions input (alone or alongside, then the candidates)
        if: inputs.captions != ''
        env:
          CAPTIONS_BENCH: ${{ inputs.captions }}
        run: node scripts/captions-bench.mjs check
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scenarios make their videos with the bundled FFmpeg (and with it the check runs a second
      # time while streaming and recording to FFmpeg on the runner).
      - name: Cache FFmpeg downloads
        if: inputs.video_cases_packaged == '' && (inputs.scenario != 'none' || inputs.places != '1')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/drashti
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}
      - name: Fetch FFmpeg
        if: inputs.video_cases_packaged == '' && (inputs.scenario != 'none' || inputs.places != '1')
        run: node scripts/fetch-ffmpeg.mjs
      # Video out (x30): the animations scenario's streaming check turns it on (Syphon on a Mac, Spout on Windows),
      # Drashti's own program built here from Syphon's or Spout's sources at one pinned commit, each file checked
      # against its own SHA-256 (scripts/fetch-video-out.mjs; never in git).
      - name: Build video out (Syphon or Spout)
        if: inputs.video_cases_packaged == '' && inputs.scenario == 'animations'
        run: node scripts/fetch-video-out.mjs
      # The video cases as a volunteer runs them, from a packaged app (scripts/check-video-cases.mjs): never on CI (Session
      # 54's question 8, answered 29 Oct 2026). A packaged Drashti ignores every test switch, so it could be let in only
      # by the real access list, which CI never asks: it says so and stops, before packaging anything.
      - name: The packaged video cases run only by hand
        if: inputs.video_cases_packaged != ''
        shell: bash
        run: |
          echo "::error::The packaged video cases run only on a computer let in, by hand (docs/parallel-run.md, section 11). On CI, choose the case under scenario: the check lets itself in through the stand-in list on 127.0.0.1."
          exit 1
      # Caption AI's two-core proof (CAP-CI-1; the owner, 24 Nov 2026: "Yes, all three"), only when asked: the app's
      # own engines (Route C's helper on ONNX Runtime 1.23.2, whisper-server) built and fetched as CI's other jobs do;
      # the models from their pinned sources, each checked by size and SHA-256 and cached by them
      # (scripts/fetch-caption-models.mjs; never in an installer); the clips committed in tests/fixtures/captions
      # (generated speech, CC-BY-4.0 voices: its CREDITS.md). The bench holds itself and its engines to two cores
      # (processor mask 3, as the handicap below does).
      - name: Cache the caption models
        if: inputs.captions != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/drashti/caption-models
          key: caption-models-${{ hashFiles('scripts/fetch-caption-models.mjs', 'src/main/speech/models.ts') }}
      - name: Fetch the live captions engine
        if: inputs.captions != ''
        run: node scripts/fetch-whisper.mjs
      # ONNX Runtime's package for Route C's helper (QA23-ORTCACHE-1), restored by its exact version, the runner's
      # platform and the SHA-256 scripts/fetch-indic.mjs pins, then checked by size and SHA-256 before use, as a
      # download is; a miss downloads it as before. Saved by CI's pushes to main and phase1 (ci.yml), never here.
      - name: ONNX Runtime's package, its cache key (version, platform, pinned SHA-256)
        if: inputs.captions != ''
        id: ort
        shell: bash
        run: node scripts/fetch-indic.mjs --cache-key >> "$GITHUB_OUTPUT"
      - name: Restore ONNX Runtime's package (by that key only)
        if: inputs.captions != ''
        id: ort-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ort.outputs.path }}
          key: ${{ steps.ort.outputs.key }}
      # A miss downloads exactly as before (cap-review-ortcache S2): whatever a restore that failed part-way left is
      # removed first. A hit (the exact key, restored whole) stays, and the build checks it.
      - name: A miss starts clean (anything a restore that failed part-way left is removed)
        if: steps.ort-cache.outcome == 'success' && steps.ort-cache.outputs.cache-hit != 'true'
        env:
          ORT_PATH: ${{ steps.ort.outputs.path }}
        shell: bash
        run: rm -f "$ORT_PATH"
      - name: Build the approved native IndicConformer runtime (no model download)
        if: inputs.captions != ''
        id: indic
        run: node scripts/fetch-indic.mjs
      - name: Captions bench, alone (two cores)
        if: startsWith(inputs.captions, 'alone')
        env:
          CAPTIONS_BENCH: ${{ inputs.captions }}
          CAPTIONS_BENCH_OUT: ${{ runner.temp }}/captions-bench
        run: node scripts/captions-bench.mjs run
      - name: Captions bench, alongside (started; two cores)
        if: startsWith(inputs.captions, 'alongside')
        env:
          CAPTIONS_BENCH: ${{ inputs.captions }}
          CAPTIONS_BENCH_OUT: ${{ runner.temp }}/captions-bench
        run: node scripts/captions-bench.mjs start
      # Let in through the stand-in list on 127.0.0.1 (tests/perf/performance.spec.ts), never the real one (question 8).
      - name: Performance self-test (headless)
        if: inputs.video_cases_packaged == '' && !startsWith(inputs.captions, 'alone')
        env:
          # The local network on (this computer only) with this many devices on the feed (README, "Performance check").
          DRASHTI_PERF_DEVICES: ${{ inputs.devices }}
          # Output nodes on this computer following the show and copying media (README, "Performance check").
          DRASHTI_PERF_NODES: ${{ inputs.nodes }}
          # An audio playlist playing meanwhile (README, "Performance check"): further down, with the scenarios.
          # Or one long sound on the audio layer; and slide changes with no import (Session 15).
          DRASHTI_PERF_SOUND_CUE: ${{ inputs.sound_cue && '1' || '0' }}
          DRASHTI_PERF_NO_IMPORT: ${{ inputs.no_import && '1' || '0' }}
          DRASHTI_PERF_MUSIC_LATE: ${{ inputs.sound_late && '1' || '0' }}
          # A CPU profile of the main process, a Chromium trace and the timeline of its gaps.
          DRASHTI_PERF_PROFILE: ${{ inputs.profile && format('{0}/perf-profile', runner.temp) || '' }}
          # A heavy case, and modest hardware (Session 15).
          DRASHTI_PERF_SCENARIO: ${{ inputs.scenario != 'none' && inputs.scenario || '' }}
          # Alongside the captions bench: on its two cores too.
          DRASHTI_PERF_HANDICAP: ${{ (inputs.handicap || startsWith(inputs.captions, 'alongside')) && '1' || '0' }}
          DRASHTI_PERF_EDITS: ${{ inputs.edits && '1' || '0' }}
          DRASHTI_PERF_SONGS: ${{ inputs.songs }}
          # The streaming check to two places at once (Session 28).
          DRASHTI_PERF_PLACES: ${{ inputs.places }}
          DRASHTI_PRIORITY: ${{ inputs.priority != 'as-set' && inputs.priority || '' }}
          # Three outputs: windows, on two pretend displays beside the runner's own, with the music.
          DRASHTI_WINDOWED_OUTPUTS: ${{ inputs.scenario == 'three-outputs' && '1' || '' }}
          DRASHTI_EXTRA_DISPLAYS: ${{ inputs.scenario == 'three-outputs' && '2' || '' }}
          DRASHTI_PERF_MUSIC: ${{ (inputs.music || inputs.scenario == 'three-outputs') && '1' || '0' }}
          # Each slide change's raw times, as JSON (Sessions 31–36, PERF-2): kept 90 days, for the ledger.
          DRASHTI_PERF_RAW: ${{ runner.temp }}/perf-raw
          # The operator window's appearance (Session 43; tests only, never packaged): empty follows the computer.
          DRASHTI_TEST_APPEARANCE: ${{ inputs.appearance }}
          # Item 6 (Session 57): the animations scenario's motion probe on the screens and the operator window (tests
          # only, never packaged; render/motion-probe.ts).
          DRASHTI_TEST_MOTION_PROBE: ${{ inputs.scenario == 'animations' && '1' || '' }}
        run: pnpm test:perf
      - name: Captions bench, alongside (stopped; its table)
        if: always() && startsWith(inputs.captions, 'alongside')
        env:
          CAPTIONS_BENCH_OUT: ${{ runner.temp }}/captions-bench
        run: node scripts/captions-bench.mjs stop
      - name: Keep the captions bench's tables (numbers only)
        if: always() && inputs.captions != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captions-bench-${{ runner.os }}
          path: ${{ runner.temp }}/captions-bench
          if-no-files-found: warn
          retention-days: 90
      - name: Keep each slide change's raw times (90 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-raw-${{ runner.os }}
          path: ${{ runner.temp }}/perf-raw
          if-no-files-found: warn
          retention-days: 90
      - name: Keep the profile, the trace and the timeline
        if: always() && inputs.profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-profile-${{ runner.os }}
          path: ${{ runner.temp }}/perf-profile*
          if-no-files-found: warn
          retention-days: 7

  # The translation engine on an Intel Mac (alpha.23, a22-intel; a22-review-mt A2; the owner's "Yes, after 15:00",
  # 24 Nov 2026: one job). The release builds the Intel copy on an Apple silicon runner and nothing there can run its
  # matrix products (Rosetta), so this job builds it natively on GitHub's Intel Mac runner, prints the processor's
  # features, and runs scripts/translate-timing.mjs: which instruction set CTranslate2 dispatches to (CT2_VERBOSE=1),
  # which of ruy's int8 kernels the program holds and runs while translating, and how long one sentence takes as the
  # app runs it, on GENERATED models only (the committed tiny one, and a full-size one made here). No model pack, no
  # package install, nothing paid; the build downloads only its own pinned, checked sources. Started by hand only, with
  # translate_intel set; the ordinary performance check is skipped then.
  translate-intel:
    name: Translation engine on an Intel Mac
    if: inputs.translate_intel
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own Node (its image carries one): no setup action, so nothing else is fetched.
      - name: The runner's processor
        run: |
          node --version
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl machdep.cpu.features machdep.cpu.leaf7_features
      - name: Build the translation engine natively (Intel)
        run: node scripts/fetch-translate.mjs --target darwin-x64
      - name: The engine's instruction set, kernel and speed (generated models only)
        run: node scripts/translate-timing.mjs proof vendor/translate/darwin-x64/drashti-translate --work "$RUNNER_TEMP/translate-timing"
      - name: Keep the proof's readings (30 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translate-intel-proof
          path: |
            ${{ runner.temp }}/translate-timing/translate-timing.json
            ${{ runner.temp }}/translate-timing/sample-beam5.txt
          if-no-files-found: warn
          retention-days: 30

  # The hall's video playback on an Intel Mac (alpha.23, a22-intelplay; the owner's QA23-INTELPLAY-1, "Yes, add it
  # (Rec.)": run only when asked, never in the release gate). The end-to-end suite runs on Apple silicon and Windows only,
  # and the owner's video once played in Drashti but not on the hall (Q60-31). Here Drashti is built on GitHub's Intel
  # Mac runner (its own Electron for Intel, the bundled FFmpeg for Intel) and tests/intel-playback/intel-playback.spec.ts
  # plays generated test videos (orange, a white bar moving along the foot; H.264 with the movie box first and last, the
  # owner's file's 1080p30 shape, VP8 in a WebM, HEVC as this Mac takes it) through the hall's own playback path: a
  # playlist row clicked, the audience screen's background video and Drashti's first-frame watch. It fails on no first
  # frame, a decoder error, a video taken off, black, a clock that does not move on, too few frames shown or a still
  # picture; its first tests prove it fails three controls (a cut copy, a black picture, a still one). Started by hand
  # only, with intel_playback set; the ordinary performance check is skipped. A VM: its graphics are in the summary.
  intel-playback:
    name: Video playback on the hall, on an Intel Mac
    if: inputs.intel_playback
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: The runner's processor
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string
          system_profiler SPDisplaysDataType | sed -n '1,25p'
      - run: pnpm install --frozen-lockfile
      - name: Cache FFmpeg downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/drashti
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}
      - name: Fetch FFmpeg (Intel)
        run: node scripts/fetch-ffmpeg.mjs
      - name: Build Drashti
        run: pnpm exec electron-vite build
      - name: Play the test videos on the hall
        id: play
        env:
          DRASHTI_PLAYBACK_READINGS: ${{ runner.temp }}/intel-playback.json
        run: pnpm exec playwright test -c playwright.intel.config.ts
      - name: The summary, one row a video (GREEN only when the step above passed and every reading came)
        if: always()
        env:
          DRASHTI_PLAYBACK_READINGS: ${{ runner.temp }}/intel-playback.json
          PLAY_OUTCOME: ${{ steps.play.outcome }}
        run: node scripts/playback-check.mjs summary "$DRASHTI_PLAYBACK_READINGS"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-playback-report
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/intel-playback.json
          if-no-files-found: ignore
          retention-days: 14
