name: Performance

# The performance check (README, "Performance check"), started by hand only:
# CI machines are virtual and stall now and then, so their timings say
# little about the mandir's computers. Useful to compare one change with
# another on the same kind of runner; the real answer comes from running the
# installed app on the mandir's Mac and PC.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating systems to run on
        type: choice
        options: [both, windows, macos]
        default: both
      devices:
        description: Paired Remote devices following the state feed during the check (0 for none)
        type: number
        default: 0
      nodes:
        description: Output nodes following the show over the node link, each copying a 32 MB file, during the check (0 for none)
        type: number
        default: 0
      music:
        description: An audio playlist plays during the check (Session 14)
        type: boolean
        default: false
      sound_cue:
        description: One long sound on the audio layer instead, as a slide's sound cue (Session 15)
        type: boolean
        default: false
      sound_late:
        description: The music (or sound cue) first starts 1.5 s into the measured part, not before it (Session 15)
        type: boolean
        default: false
      no_import:
        description: Slide changes for 20 s with no import, to tell the import's share (Session 15)
        type: boolean
        default: false
      profile:
        description: Keep a CPU profile of the main process, a Chromium trace and the gaps' timeline (an artifact)
        type: boolean
        default: false
      scenario:
        description: A heavy case for the screens (Session 15; needs FFmpeg, fetched for it)
        type: choice
        options: [none, video-1080p30, masks-video, video-1080p60, video-4k, dissolves-video, three-outputs]
        default: none
      handicap:
        description: 'Modest hardware: two cores for Drashti on Windows, two busy processes competing on a Mac'
        type: boolean
        default: false
      edits:
        description: "An operator's edits (words, a playlist, a theme) every 0.7 s during the import, timed (Session 16)"
        type: boolean
        default: false
      video_cases_packaged:
        description: 'Instead: these video cases (comma-separated) from a packaged Drashti, as on the mandir computers (Session 16)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  performance:
    name: Performance check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scenarios make their videos with the bundled FFmpeg (and with it the check runs a second
      # time while streaming and recording to FFmpeg on the runner).
      - name: Cache FFmpeg downloads
        if: inputs.scenario != 'none' || inputs.video_cases_packaged != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/drashti
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}
      - name: Fetch FFmpeg
        if: inputs.scenario != 'none' || inputs.video_cases_packaged != ''
        run: node scripts/fetch-ffmpeg.mjs
      # The video cases as a volunteer runs them, from a packaged app (scripts/check-video-cases.mjs).
      - name: Package Drashti (unpacked)
        if: inputs.video_cases_packaged != ''
        run: pnpm package:dir
      - name: The video cases from the packaged app
        if: inputs.video_cases_packaged != ''
        env:
          CASES: ${{ inputs.video_cases_packaged }}
        shell: bash
        run: node scripts/check-video-cases.mjs --cases "$CASES"
      - name: Performance self-test (headless)
        if: inputs.video_cases_packaged == ''
        env:
          # The local network on (this computer only) with this many devices on the feed (README, "Performance check").
          DRASHTI_PERF_DEVICES: ${{ inputs.devices }}
          # Output nodes on this computer following the show and copying media (README, "Performance check").
          DRASHTI_PERF_NODES: ${{ inputs.nodes }}
          # An audio playlist playing meanwhile (README, "Performance check"): further down, with the scenarios.
          # Or one long sound on the audio layer; and slide changes with no import (Session 15).
          DRASHTI_PERF_SOUND_CUE: ${{ inputs.sound_cue && '1' || '0' }}
          DRASHTI_PERF_NO_IMPORT: ${{ inputs.no_import && '1' || '0' }}
          DRASHTI_PERF_MUSIC_LATE: ${{ inputs.sound_late && '1' || '0' }}
          # A CPU profile of the main process, a Chromium trace and the timeline of its gaps.
          DRASHTI_PERF_PROFILE: ${{ inputs.profile && format('{0}/perf-profile', runner.temp) || '' }}
          # A heavy case, and modest hardware (Session 15).
          DRASHTI_PERF_SCENARIO: ${{ inputs.scenario != 'none' && inputs.scenario || '' }}
          DRASHTI_PERF_HANDICAP: ${{ inputs.handicap && '1' || '0' }}
          DRASHTI_PERF_EDITS: ${{ inputs.edits && '1' || '0' }}
          # Three outputs: windows, on two pretend displays beside the runner's own, with the music.
          DRASHTI_WINDOWED_OUTPUTS: ${{ inputs.scenario == 'three-outputs' && '1' || '' }}
          DRASHTI_EXTRA_DISPLAYS: ${{ inputs.scenario == 'three-outputs' && '2' || '' }}
          DRASHTI_PERF_MUSIC: ${{ (inputs.music || inputs.scenario == 'three-outputs') && '1' || '0' }}
        run: pnpm test:perf
      - name: Keep the profile, the trace and the timeline
        if: always() && inputs.profile
        uses: actions/upload-artifact@v7
        with:
          name: perf-profile-${{ runner.os }}
          path: ${{ runner.temp }}/perf-profile*
          if-no-files-found: warn
          retention-days: 7
