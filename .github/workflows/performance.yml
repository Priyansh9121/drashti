name: Performance

# The performance check (README, "Performance check"), started by hand only:
# CI machines are virtual and stall now and then, so their timings say
# little about the mandir's computers. Useful to compare one change with
# another on the same kind of runner; the real answer comes from running the
# installed app on the mandir's Mac and PC.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating systems to run on
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  contents: read

jobs:
  performance:
    name: Performance check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Performance self-test (headless)
        run: pnpm test:perf
