name: CI

# Private-repo Actions minutes: macOS counts 10x and Windows 2x, so the cheap
# checks run on Ubuntu for every push, and the end-to-end and packaging jobs
# run on macOS and Windows only for pushes to main, pull requests and manual
# runs. A manual run can target one OS.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Operating systems for the end-to-end and packaging jobs
        type: choice
        options: [both, windows, macos]
        default: both

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit of every branch and tag, not just the one being built.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The pinned gitleaks finds a planted token and prints it redacted, then the real scan.
      - run: node scripts/secret-scan.mjs --self-check
      - run: node scripts/secret-scan.mjs

  checks:
    name: Typecheck, lint, unit tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (inside Electron's Node)
        run: pnpm test

  app:
    name: End-to-end and installers (${{ matrix.os }})
    needs: [secrets, checks]
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned internal builds for now; signing comes with distribution.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (inside Electron's Node)
        run: pnpm test
      - name: End-to-end tests (Playwright + Electron)
        run: pnpm test:e2e
      - name: Package installers
        run: pnpm exec electron-builder --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: drashti-${{ runner.os }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ runner.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
