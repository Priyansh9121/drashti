name: CI

# The repository is public, so standard runners are free: the end-to-end and
# packaging jobs run on macOS and Windows for every push to phase1 and main,
# pull requests and manual runs (a manual run can target one OS). Pushes to
# other branches get the Ubuntu checks and the secret scan only.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Operating systems for the end-to-end and packaging jobs
        type: choice
        options: [both, windows, macos]
        default: both

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit of every branch and tag, not just the one being built.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The pinned gitleaks finds a planted token and prints it redacted, then the real scan.
      - run: node scripts/secret-scan.mjs --self-check
      - run: node scripts/secret-scan.mjs

  checks:
    name: Typecheck, lint, unit tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (inside Electron's Node)
        run: pnpm test

  app:
    name: End-to-end and installers (${{ matrix.os }})
    needs: [secrets, checks]
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase1'))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned internal builds for now; signing comes with distribution.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The FFmpeg Drashti bundles: pinned builds, checked against their SHA-256 (never in git).
      - name: Cache FFmpeg downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/drashti
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}
      - name: Fetch FFmpeg
        run: node scripts/fetch-ffmpeg.mjs
      - name: Fetch FFmpeg for Intel Macs too (both Mac builds are packaged here)
        if: runner.os == 'macOS'
        run: node scripts/fetch-ffmpeg.mjs --target darwin-x64
      - name: Unit tests (inside Electron's Node)
        run: pnpm test
      - name: End-to-end tests (Playwright + Electron)
        run: pnpm test:e2e
      - name: Drashti finds and runs its FFmpeg (built app)
        run: node scripts/check-ffmpeg.mjs
      # Playwright cannot follow app.relaunch(): back up, restore and restart for real.
      - name: Restart after a restore (built app)
        run: node scripts/check-relaunch.mjs
      - name: Package installers
        run: pnpm exec electron-builder --publish never
      - name: Restart after a restore (packaged app)
        run: node scripts/check-relaunch.mjs --packaged
      - name: Drashti finds and runs its FFmpeg (each packaged app)
        run: node scripts/check-ffmpeg.mjs --packaged
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: drashti-${{ runner.os }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
          if-no-files-found: error
          retention-days: 7
      # Always: a test that passed only on its retry ("flaky") keeps the trace of the attempt that
      # failed in test-results, and that is the only way to see what went wrong.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ runner.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
