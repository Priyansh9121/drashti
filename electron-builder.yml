# Electron's fuses (Sessions 31–36, REL-7): a packaged Drashti never runs as Node (ELECTRON_RUN_AS_NODE),
# never reads NODE_OPTIONS and never takes --inspect; its pages are file://, so file:// keeps its privileges.
# Asar integrity is not now. electron-builder flips them right before it signs (ad hoc on a Mac without a
# certificate), so the signature covers them; and a Mac's ad hoc signature is made again after flipping,
# for a build that is not signed after. scripts/check-installers.mjs reads them from each installed app.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true
asarUnpack:
  - '**/*.node'
# better-sqlite3's Node-API prebuilds load in Electron as they are.
npmRebuild: false
mac:
  # Drashti's own icon (Session 19), made with the .ico and the phone pages' icons from build/icon.svg by
  # scripts/make-icons.mjs (pnpm icons). Without it the app carried Electron's.
  icon: build/icon.icns
  # Apple silicon and Intel Macs, each with its own FFmpeg.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Electron 44 needs macOS 13 Ventura or later (see README, open risks).
  minimumSystemVersion: '13.0'
  # Signing (Session 14): only when a Developer ID certificate is given (CSC_LINK, from CI secrets in the
  # release workflow; see scripts/package-release.mjs); otherwise the app is left unsigned. Every binary
  # in the app is signed, the bundled FFmpeg included, under the hardened runtime notarisation needs,
  # with the camera and sound input allowed for the stream. Notarisation follows when the APPLE_API_*
  # variables are set too, and is skipped when they are not.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # The bundled FFmpeg (scripts/fetch-ffmpeg.mjs), a separate program: LICENSES/ffmpeg/. And YouTube's
  # two programs (scripts/fetch-youtube-tools.mjs, Session 25c): yt-dlp, unpacked (one universal folder,
  # its framework's symbolic links kept), and Deno: LICENSES/yt-dlp/ and LICENSES/deno/. Signed with the
  # rest of the app.
  extraResources:
    - from: vendor/ffmpeg/darwin-${arch}
      to: ffmpeg
      filter: [ffmpeg]
    - from: vendor/yt-dlp/darwin-${arch}
      to: yt-dlp
      filter: ['**/*', '!SOURCE.txt']
    - from: vendor/deno/darwin-${arch}
      to: deno
      filter: [deno]
  # macOS asks the operator before Drashti may use a camera or a sound input (for the stream).
  extendInfo:
    NSCameraUsageDescription: Drashti uses the camera or capture card you choose for the stream to YouTube.
    NSMicrophoneUsageDescription: Drashti uses the sound input you choose (the mixer’s line in) for the stream to YouTube.
    NSAppleEventsUsageDescription: Drashti asks Keynote or PowerPoint to save a presentation you import as PDF, to show its slides as pictures.
dmg:
  # The disk image's own icon when it is opened in Finder.
  icon: build/icon.icns
win:
  # The app (and so its Start menu entry and its windows in the taskbar); the windows also name it
  # themselves (src/main/windows/app-icon.ts), from the copy beside the app's resources.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Signing (Session 14): only when a certificate is given (WIN_CSC_LINK, or Azure Trusted Signing; see
  # scripts/package-release.mjs). The app, the installer, the bundled ffmpeg.exe, the native module and
  # every DLL are signed then.
  signExts: ['.node', '.dll']
  extraResources:
    - from: vendor/ffmpeg/win32-${arch}
      to: ffmpeg
      filter: [ffmpeg.exe]
    - from: vendor/yt-dlp/win32-${arch}
      to: yt-dlp
      filter: ['**/*', '!SOURCE.txt']
    - from: vendor/deno/win32-${arch}
      to: deno
      filter: [deno.exe]
    - from: build/icon.ico
      to: icon.ico
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
