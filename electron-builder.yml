appId: org.drashti.app
productName: Drashti
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  # better-sqlite3 needs only its JS and the prebuilt Node-API binaries.
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/prebuilds/linux*'
extraResources:
  - from: LICENSES
    to: licenses
  # The guides inside Drashti (Sessions 31–36): the four guides and only the pictures they show, read by the
  # main process (src/main/guides.ts) and never served to phones. src/main/guides.test.ts keeps this list
  # the same as what the guides show.
  - from: docs
    to: guides
    filter:
      - operator-guide.md
      - presenter-guide.md
      - admin-guide.md
      - setup-day.md
      - screenshots/admin-pin.png
      - screenshots/appearance-window.png
