      - screenshots/first-start-welcome.png
      - screenshots/idle-dialog.png
      - screenshots/import-link-dropbox.png
      - screenshots/import-link-report.png
      - screenshots/import-link-youtube.png
      - screenshots/keep-changes.png
      - screenshots/keys-sheet.png
      - screenshots/live-zoom.png
      - screenshots/marker-jumps.png
      - screenshots/markers-dialog.png
      - screenshots/music-panel.png
      - screenshots/node-diagnostics-saved.png
      - screenshots/node-update-offer.png
      - screenshots/operator-1920x1080.png
      - screenshots/phone-remote-notes.png
      - screenshots/phone-remote-search.png
      - screenshots/phones-panel.png
      - screenshots/picture-editor.png
      - screenshots/playlist-cards.png
      - screenshots/playlist-up-down.png
