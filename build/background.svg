<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400"
  font-family="'Noto Sans', sans-serif">
  <!--
    The window of Drashti's Mac disk image (Session 50, section 11): the two steps a new Mac needs, drawn at
    the window's size in points. scripts/make-dmg-background.mjs makes build/background.png (660 x 400) and
    build/background@2x.png (1320 x 800) from it. electron-builder.yml's dmg block puts the app in
    "app-place" and the Applications link in "applications-place", at the two ends of "arrow"
    (src/main/release-checks/dmg-background.test.ts keeps them together). The White appearance's colours
    (src/shared/appearance/appearances.ts), and the mark in the logo's own (build/icon.svg). Nothing but the
    background in the bottom 28 points: a Finder window's title bar can take them.
  -->
  <defs>
    <linearGradient id="tile-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e1b52"/>
      <stop offset="1" stop-color="#2a0b27"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ef9b33"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="#f8f8fa"/>

  <!-- Drashti's mark (build/icon.svg's tile, flame, core and lamp) beside its name. -->
  <rect width="660" height="48" fill="#ffffff"/>
  <path d="M0 48.5H660" stroke="#d4d6dc"/>
  <svg x="28" y="12" width="24" height="24" viewBox="100 100 824 824">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile-fill)"/>
    <path d="M512 172C566 288 690 414 690 552A178 178 0 0 1 334 552C334 414 458 288 512 172Z" fill="url(#flame)"/>
    <path d="M512 404C538 458 594 512 594 584A82 82 0 0 1 430 584C430 512 486 458 512 404Z" fill="#fff3c4"/>
    <path d="M262 690H762C750 792 644 852 512 852C380 852 274 792 262 690Z"
      fill="url(#bowl)" stroke="#370f32" stroke-width="30" paint-order="stroke"/>
  </svg>
  <text x="62" y="30" font-size="16" font-weight="700" fill="#111216">Drashti</text>

  <!-- 1. The app (its icon in app-place) dragged along the arrow onto the Applications link. -->
  <circle cx="44" cy="78" r="12" fill="#1c1d22"/>
  <text x="44" y="83" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="68" y="84" font-size="18" font-weight="700" fill="#111216">Drag Drashti to Applications</text>
  <rect id="app-place" x="108.5" y="98.5" width="135" height="125" rx="12" fill="#ffffff" stroke="#d4d6dc"/>
  <rect id="applications-place" x="416.5" y="98.5" width="135" height="125" rx="12" fill="#ffffff"
    stroke="#d4d6dc"/>
  <path id="arrow" d="M258 152H390" fill="none" stroke="#1c1d22" stroke-width="4" stroke-linecap="round"/>
  <path d="M404 152L389 142.5V161.5Z" fill="#1c1d22" stroke="#1c1d22" stroke-width="2" stroke-linejoin="round"/>

  <path d="M28 244.5H632" stroke="#d4d6dc"/>

  <!-- 2. The first time, if the Mac stops Drashti (it has no paid Developer ID): the free way past. -->
  <circle cx="44" cy="274" r="12" fill="#1c1d22"/>
  <text x="44" y="279" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="68" y="280" font-size="18" font-weight="700" fill="#111216">The first time you open it</text>
  <text x="68" y="304" font-size="14" fill="#43464e">If the Mac says Drashti can’t be opened:</text>
  <g font-size="14" font-weight="500" text-anchor="middle">
    <g class="chip">
      <rect x="68.5" y="316.5" width="135" height="27" rx="8" fill="#ffffff" stroke="#b4b7bf"/>
      <text x="136" y="335" fill="#111216">System Settings</text>
    </g>
    <text x="217" y="335" font-size="18" font-weight="400" fill="#43464e">›</text>
    <g class="chip">
      <rect x="230.5" y="316.5" width="147" height="27" rx="8" fill="#ffffff" stroke="#b4b7bf"/>
      <text x="304" y="335" fill="#111216">Privacy &amp; Security</text>
    </g>
    <text x="391" y="335" font-size="18" font-weight="400" fill="#43464e">›</text>
    <g class="chip">
      <rect x="404.5" y="316.5" width="125" height="27" rx="8" fill="#1c1d22" stroke="#1c1d22"/>
      <text x="467" y="335" font-weight="700" fill="#ffffff">Open Anyway</text>
    </g>
  </g>
</svg>
